[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-metadata-monitor"
version = "0.4.0"
description = "Local ransomware metadata monitoring and analyst investigation workspace"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["requests[socks]>=2.32.4,<3", "beautifulsoup4>=4.13,<5"]

[project.optional-dependencies]
dev = ["coverage>=7.6,<8", "build>=1.2,<2"]

[project.scripts]
sentinel = "sentinel.__main__:main"

[tool.setuptools.packages.find]
include = ["sentinel*"]

[tool.setuptools.package-data]
sentinel = ["static/*.html", "static/*.js", "static/*.css"]

[tool.coverage.run]
source = ["sentinel"]
branch = true

[tool.coverage.report]
show_missing = true
